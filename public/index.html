<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Wer ist das?</title>
  <link rel="stylesheet" href="style.css?v=20260608a">
</head>
<body>

  <!-- JOIN -->
  <div id="screen-join" class="screen active">
    <div class="card">
      <h1>🎭 Wer ist das?</h1>
      <p class="subtitle">Multiplayer Ratespiel</p>
      <input type="text" id="player-name" placeholder="Dein Name" maxlength="20" autocomplete="off">
      <button id="btn-create" class="btn primary">Neues Spiel erstellen</button>
      <div class="divider"><span>oder beitreten</span></div>
      <div class="join-row">
        <input type="text" id="room-code" placeholder="Raumcode" maxlength="4" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em">
        <button id="btn-join" class="btn secondary">Beitreten</button>
      </div>
      <p id="join-error" class="error hidden"></p>
      <button id="btn-show-leaderboard" class="btn-text-link" style="margin-top:.75rem">🏆 Allzeit-Rangliste</button>
    </div>
  </div>

  <!-- LEADERBOARD -->
  <div id="screen-leaderboard" class="screen">
    <div class="card">
      <div class="pool-header">
        <button id="btn-leaderboard-back" class="pool-back-btn">← Zurück</button>
        <h2>🏆 Allzeit-Rangliste</h2>
        <span></span>
      </div>
      <div id="leaderboard-list" class="leaderboard-list"></div>
    </div>
  </div>

  <!-- LOBBY -->
  <div id="screen-lobby" class="screen">
    <div class="card">
      <h2>Warteraum</h2>
      <div class="room-code-box">
        <span class="room-code-label">Raumcode</span>
        <strong id="lobby-code">----</strong>
        <span class="room-code-hint">Teile diesen Code mit deinen Freunden</span>
      </div>
      <div id="player-list" class="player-list"></div>
      <div id="host-controls" class="hidden">
        <div class="cat-section">
          <div class="cat-section-header">
            <span class="cat-section-label">Kategorien</span>
            <span id="pool-count-label" class="cat-count-total">357 Personen</span>
          </div>
          <div id="category-chips" class="category-chips"></div>
        </div>
        <div class="cat-section">
          <div class="cat-section-header">
            <span class="cat-section-label">Länder</span>
          </div>
          <div id="country-chips" class="category-chips"></div>
        </div>
        <div class="rounds-selector">
          <label>Anzahl Runden</label>
          <div class="rounds-row">
            <button class="rounds-btn" id="rounds-minus">−</button>
            <span id="rounds-display">10</span>
            <button class="rounds-btn" id="rounds-plus">+</button>
          </div>
        </div>
        <button id="btn-start" class="btn primary">Spiel starten 🚀</button>
        <button id="btn-manage-pool" class="btn-text-link">Personen manuell anpassen ✏</button>
      </div>
      <p id="waiting-msg" class="muted">Warte auf den Host…</p>
    </div>
  </div>

  <!-- POOL MANAGEMENT -->
  <div id="screen-pool" class="screen">
    <div class="card">
      <div class="pool-header">
        <button id="btn-pool-back" class="pool-back-btn">← Lobby</button>
        <h2>Personen-Pool</h2>
        <span id="pool-screen-count" class="pool-screen-count"></span>
      </div>
      <div class="add-person-row">
        <input type="text" id="pool-name-input" placeholder="Name eingeben (z.B. Helmut Schmidt)" maxlength="80" autocomplete="off">
        <button id="btn-add-person" class="btn secondary">+</button>
      </div>
      <p id="pool-feedback" class="pool-feedback hidden"></p>
      <div id="pool-person-list"></div>
    </div>
  </div>

  <!-- GAME -->
  <div id="screen-game" class="screen">
    <div class="game-header">
      <span id="round-label" class="round-label">Runde 1/10</span>
      <div class="timer-ring">
        <svg viewBox="0 0 36 36">
          <path class="timer-bg" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
          <path id="timer-arc" class="timer-fg" stroke-dasharray="100,100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"/>
        </svg>
        <span id="timer-text">30</span>
      </div>
      <span id="my-score" class="my-score">0 Pkt.</span>
    </div>
    <div class="image-container">
      <img id="person-image" src="" alt="Wer ist das?">
      <div id="image-status" class="image-status hidden"></div>
      <div id="correct-overlay" class="correct-overlay hidden"><div class="correct-badge">✓ Richtig!</div></div>
    </div>
    <div class="guess-area">
      <div class="guess-input-wrap">
        <div class="guess-input-row">
          <input type="text" id="guess-input" placeholder="Wer ist diese Person?" autocomplete="off">
          <button id="btn-guess" class="btn primary">Raten</button>
        </div>
        <div id="guess-suggestions" class="guess-suggestions hidden"></div>
      </div>
      <div id="guess-feedback" class="hidden"></div>
    </div>
    <div id="live-scores" class="live-scores"></div>
    <div style="text-align:center;margin-top:.5rem">
      <button id="btn-skip" class="btn-skip">Aufgeben (0/1)</button>
    </div>
  </div>

  <!-- ROUND END -->
  <div id="screen-round-end" class="screen">
    <div class="card">
      <h2>Auflösung</h2>
      <div class="answer-reveal">
        <img id="reveal-image" src="" alt="">
        <div class="reveal-info">
          <h3 id="reveal-name"></h3>
          <p id="reveal-info-text" class="muted"></p>
        </div>
      </div>
      <div id="round-scores"></div>
      <div id="host-next" class="hidden"><button id="btn-next" class="btn primary">Nächste Runde ▶</button></div>
      <p id="waiting-next" class="muted hidden">Warte auf den Host…</p>
    </div>
  </div>

  <!-- END -->
  <div id="screen-end" class="screen">
    <div class="card">
      <h1>🏆 Endergebnis</h1>
      <div id="final-scores"></div>
      <button id="btn-play-again" class="btn primary" style="margin-top:1.5rem">Nochmal spielen</button>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="firebase-config.js?v=20260608a"></script>
  <script src="persons.js?v=20260608a"></script>
  <script src="app.js?v=20260608a"></script>
</body>
</html>
